<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホテル店舗情報｜洗浄事業部用</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e4e7ec;--accent:#1f5fae;--alert:#e03e3e}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.regions{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.regions button{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.regions button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.red .v{color:var(--alert)}
.summary{color:var(--muted);font-size:13px;margin:6px 2px 10px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.store{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.store>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.store>summary::-webkit-details-marker{display:none}
.store>summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;transition:transform .15s}
.store[open]>summary::after{transform:rotate(90deg)}
.name{font-weight:600}
.pref{color:var(--muted);font-size:12px;margin-left:4px;font-weight:400}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.b{font-size:11px;padding:1px 7px;border-radius:5px;background:#f0f2f5;color:#475467}
.b.none{background:var(--alert);color:#fff;font-weight:700}
.b.ten{background:#fce4d6;color:#7a3b12}.b.tan{background:#e2efda;color:#2f5f20}.b.bath{background:#ede4f7;color:#4f2d82}
.b.soon{background:#fff4d6;color:#8a5a00}
.detail{border-top:1px solid var(--line);padding:12px 14px 14px}
dl{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;margin:0 0 12px}
dt{color:var(--muted);font-size:13px}dd{margin:0}
.big{font-size:17px;font-weight:700}
.alert{color:var(--alert);font-weight:700}
.gm{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-size:14px}
.note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ホテル店舗情報</h1>

  <div class="kpis" id="kpis"></div>
  <div class="regions" id="regions"></div>
  <div class="summary" id="summary"></div>

  <p class="note">
    温泉・大浴場：スーパーホテル公式サイトの店舗一覧の設備表示。客室数・駐車場：楽天トラベル各ホテルの基本情報。<br>
    駐車料金・台数は改定されている場合があります。訪問前にホテルへご確認ください。
  </p>
</div>

1-1-38","j":false}];
const REGIONS = ["北海道","東北","関東","甲信越","北陸","東海","近畿","中国","四国","九州","沖縄"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen = v => v == null ? "記載なし" : (v === 0 ? "無料" : v.toLocaleString() + "円");

function kpis(rows){
  const o = rows.filter(d => d.st === "営業中"), sum = o.reduce((s,d)=>s+d.rm,0);
  const k = [["店舗数（営業中）",o.length,""],["客室数合計",sum.toLocaleString(),""],["1店舗平均",o.length?Math.round(sum/o.length)+"室":"―",""],
    ["天然温泉あり",o.filter(d=>d.on==="天然温泉").length,""],["温泉・大浴場なし",o.filter(d=>d.on==="なし").length,"red"],
    ["駐車場なし",o.filter(d=>d.pk==="なし").length,"red"],["駐車場が有料・提携",o.filter(d=>d.pk==="自社・有料"||d.pk==="提携").length,""]];
  document.getElementById("kpis").innerHTML = k.map(([l,v,c]) => `<div class="kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}
kpis(DATA);
const regionsEl = document.getElementById("regions");
REGIONS.forEach(r => {
  const n = DATA.filter(d => d.r === r).length;
  const b = document.createElement("button");
  b.textContent = `${r}（${n}）`;
  b.onclick = () => { document.querySelectorAll(".regions button").forEach(x => x.classList.remove("on")); b.classList.add("on"); show(r); };
  regionsEl.appendChild(b);
});

function onsenBadge(on){
  if (on === "なし") return `<span class="b none">温泉・大浴場なし</span>`;
  const cls = on === "天然温泉" ? "ten" : on === "人工炭酸泉" ? "tan" : "bath";
  return `<span class="b ${cls}">${esc(on)}</span>`;
}
function parkBadge(d){
  if (d.pk === "なし") return `<span class="b none">駐車場なし</span>`;
  if (d.pk === "要確認") return `<span class="b">駐車場 要確認</span>`;
  if (d.pk === "提携") return `<span class="b">提携駐車場 ${d.pf != null ? yen(d.pf) : ""}</span>`;
  return `<span class="b">駐車場 ${yen(d.pf) === "記載なし" ? "有料（料金記載なし）" : yen(d.pf)}</span>`;
}

function show(region){
  const rows = DATA.filter(d => d.r === region);
  kpis(rows);
  rows.sort((a,b) => a.p.localeCompare(b.p,"ja") || a.n.localeCompare(b.n,"ja"));
  const open = rows.filter(d => d.st === "営業中");
  document.getElementById("summary").textContent =
    `${region}：${rows.length}店舗／客室 計${open.reduce((s,d)=>s+d.rm,0).toLocaleString()}室（営業中）`;
  document.getElementById("list").innerHTML = rows.map(d => {
    const gm = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("スーパーホテル" + d.n + " " + d.ad);
    const bath = d.on === "なし" ? `<span class="alert">なし</span>` : `あり（${esc(d.on)}）`;
    const park = d.pk === "なし" ? `<span class="alert">なし</span>` : esc(d.pk);
    return `<details class="store">
      <summary><div>
        <div class="name">${d.j ? "★ " : ""}${esc(d.n)}<span class="pref">${esc(d.p)}</span></div>
        <div class="badges"><span class="b">${d.rm}室</span>${onsenBadge(d.on)}${parkBadge(d)}${d.st!=="営業中" ? `<span class="b soon">${esc(d.st)}</span>` : ""}</div>
      </div></summary>
      <div class="detail"><dl>
        <dt>客室数</dt><dd class="big">${d.rm}室</dd>
        <dt>温泉・大浴場</dt><dd>${bath}</dd>
        <dt>駐車場</dt><dd>${park}</dd>
        ${d.pk!=="なし" ? `<dt>台数</dt><dd>${d.pc != null ? d.pc + "台" : "記載なし"}</dd>
        <dt>駐車料金</dt><dd class="big">${d.pk==="要確認" ? "要確認" : yen(d.pf) + (d.pf ? "／1泊" : "")}</dd>` : ""}
        ${d.pn ? `<dt>駐車場の備考</dt><dd>${esc(d.pn)}</dd>` : ""}
        <dt>住所</dt><dd>${esc(d.ad)}</dd>
      </dl>
      <a class="gm" href="${gm}" target="_blank" rel="noopener">Googleマップで開く</a></div>
    </details>`;
  }).join("");
}
